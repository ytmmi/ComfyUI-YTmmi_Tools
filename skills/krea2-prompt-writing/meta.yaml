summary-cn: 按 Krea 2 官方规则把精简需求写成稠密自然语言 caption（媒介与风格锚句、主体身份、服装、动作因果、机位景深、材质分区与色盘、光位后果、画内文字），用句子代替 tag 串，并在交付前过自检清单。
summary-en: Write or rewrite a Krea 2 prompt as a dense natural-language caption in the trained order, following the official expansion rules — faithfulness first, one cohesive paragraph, no tag streams, no quality tokens, quoted in-image text — with a pre-delivery checklist.
