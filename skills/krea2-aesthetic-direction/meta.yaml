summary-en: Decide and write Krea 2's aesthetic layer — one art direction, sourced light, material splits, counted palette, grain and lens — with anti-AI-look rules, a mood recipe index, and a mapping from Krea 2's Creativity levels, Intensity/Complexity/Movement sliders, style references and moodboards to prompt wording.
