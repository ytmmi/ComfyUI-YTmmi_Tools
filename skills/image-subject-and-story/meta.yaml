display-name-zh: 主题与叙事
display-name-en: Image Subject & Story
version: 1.0.0
tag-cn: 提示词 / 叙事 / 主题
tag-en: Prompt / Story / Narrative
summary-cn: 先写一句「这张图在说 ___」定主题，再把叙事冻结在最可读的一瞬（一个动作 + 一个还在变化的后果），用道具承担时间、用缺席表达关系，并给出多人「写关系不写排队」与七类空洞画面的修法。
summary-en: Decide what the image is about, freeze the story at its most legible instant, let props carry time, narrate through absence, and stage groups by relationship instead of lineup.
source: web